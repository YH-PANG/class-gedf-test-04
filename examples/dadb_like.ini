# Phenomenological late-time DADB-like interacting dark sector.
# omega_cdm remains the present total CDM density; CLASS splits it internally.
h = 0.68
omega_b = 0.0224
omega_cdm = 0.122541

dadb_like = yes
dadb_F_d = 0.30
dadb_Delta_e = 0.0
dadb_z_e = 3500.0
dadb_p_e = 6.0
dadb_Delta_l = 0.080
dadb_z_l = 0.43
dadb_p_l = 6.0
dadb_epsilon_X = 0.25
dadb_z_X = 0.08
dadb_p_X = 20.0
dadb_perturbation_mode = drag_only
dadb_beta5 = 0.50
dadb_kC_hmpc = 0.05

# Synchronous gauge is required by this first implementation.
gauge = synchronous
output = tCl,pCl,lCl,mPk
P_k_max_h/Mpc = 1.0
z_pk = 0,1
k_output_values = 0.001,0.068,0.68
lensing = yes
root = output/dadb_like_
write background = yes
write perturbations = yes
write parameters = yes

