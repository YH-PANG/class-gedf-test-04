sampler:
  mcmc:
    # Measure one valid point (plus Cobaya's discarded warm-up evaluation).
    # Invalid CLASS shooting points are rejected and retried because
    # stop_at_error is disabled below.
    measure_speeds: 1
    drag: false
    proposal_scale: 1.9
    Rminus1_stop: 0.01
    output_every: 60s
    learn_every: 10
    learn_proposal_Rminus1_max: 1000.0
    learn_proposal_Rminus1_max_early: 10000.0
    max_tries: 1000
output: 260705_gedf_2
stop_at_error: false
